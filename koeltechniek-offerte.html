<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koeltechniek Offerte</title>

<link rel="stylesheet" href="koeltechniek-offerte.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>


<body>

<section class="configurator">

<div class="content-box">

<h2>Offerteaanvraag Koeltechnieken</h2>

<form id="koelForm">

<label>Waar wilt u een offerte van?</label>

<select name="offerte" required>
<option value="">Selecteer...</option>
<option>Koelcel</option>
<option>Vriescel</option>
<option>Wandkoeling</option>
<option>Onderkoeling</option>
<option>Anders</option>
</select>

<input name="firma" placeholder="Firma (optioneel)">
<input name="naam" placeholder="Naam" required>
<input name="email" type="email" placeholder="E-mail" required>
<input name="tel" type="tel" placeholder="Telefoonnummer" required>
<input name="adres" placeholder="Adres" required>

<label>Via waar heeft u ons gevonden?</label>

<select name="bron" required>
<option value="">Selecteer...</option>
<option>Google</option>
<option>Facebook</option>
<option>Instagram</option>
<option>Kennissen</option>
<option>Iets anders</option>
</select>

<!-- spam bescherming -->
<input type="text" name="website" style="display:none">

<button type="submit" class="submit-btn">
Verstuur aanvraag
</button>

</form>

</div>

</section>


<!-- POPUP -->

<div id="popup" class="price-popup">

<div class="price-box">

<h3>Bedankt voor uw aanvraag</h3>

<p>
Ons team neemt zo snel mogelijk contact met u op
om uw project te bespreken en een offerte op maat te maken.
</p>

<div class="popup-buttons">

<a href="mailto:info@klimacontrol.be" class="popup-btn popup-email">
<i class="fa-solid fa-envelope"></i>
Stuur ons een e-mail
</a>

<a href="tel:+3211964112" class="popup-btn popup-call">
<i class="fa-solid fa-phone"></i>
Bel ons
</a>

<a href="index.html" class="popup-close">
<i class="fa-solid fa-house"></i>
Ga naar startpagina
</a>

</div>

</div>

</div>



<script>

document.getElementById("koelForm").addEventListener("submit", function(e){

e.preventDefault();

const formData = new FormData(this);

fetch("send-koeltechniek-mail.php",{
method:"POST",
body:formData
})
.then(res => res.text())
.then(data => {

document.getElementById("popup").style.display="flex";

});

});

</script>



<!-- ===============================
   FOOTER BAR
================================ -->

<footer class="footer-bar">

<div class="footer-left">
<img src="images/logo footer.jpeg" alt="Logo" class="footer-logo">
</div>

<div class="footer-center">
<a href="index.html" class="footer-home-btn">
Terug naar startscherm
</a>
</div>

<div class="footer-right">
<img src="images/google.png" alt="Google" class="google-logo">
<span class="review-score">4.9</span>
<span class="review-stars">★★★★★</span>
</div>

</footer>

</body>

</html>
